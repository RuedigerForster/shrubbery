[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shrubbery"
version = "0.1.2"
description = "APPAC — Atmospheric Pressure Peak Area Correction (pure NumPy)"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "matplotlib",
]

[project.license]
file = "LICENSE"

[tool.ruff.lint]
# Catch real problems (pyflakes + syntax errors); leave purely stylistic rules
# (line length, import position, compact one-liners) to taste.
select = ["E9", "F"]
