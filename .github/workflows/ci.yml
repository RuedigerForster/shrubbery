name: CI

# Lint + tests on every push and pull request.
on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff + package (pulls runtime deps from pyproject)
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -e .

      - name: Lint (ruff — pyflakes + syntax, config in pyproject.toml)
        run: ruff check .

      - name: Tests (synthetic data — no data file needed)
        run: |
          python test_appac_unit.py
          python test_appac.py
          python test_control_updater.py

      - name: Smoke test on the bundled real dataset
        run: python run_appac_on_data.py
